workflowVersion: 1.0.0
speakeasyVersion: latest
sources:
    default:
        inputs:
            - location: openapi.yaml
        registry:
            location: registry.speakeasyapi.dev/log10/log10/default
targets:
    my-first-target:
        target: go
        source: default
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/log10/log10/default-go-code-samples
            labelOverride:
                fixedValue: Go (SDK)
            blocking: false
